<!DOCTYPE html>     
<html>

<head>
    <meta charset="UTF-8">
    <title>MultipleHelper - Main Menu</title>
    <link rel="stylesheet" href="css/style.css">
</head>


<body>
    <div class="menu-container">
        <h1 class="title">MultipleHelper<span class="cursor"></span></h1>
        
        <div class="actions">
            <button id="createRoomBtn" class="btn">Create New Room</button>
            
            <div class="join-section">
                <input type="text" id="roomCodeInput" placeholder="Enter The Code..." class="input-box">
                <button id="joinRoomBtn" class="btn">Join Room</button>
            </div>
        </div>

        <div class="history-section">
            <h3 class="localSaves">Local Saves (Recent Rooms):</h3>
            <div id="historyList"></div>
        </div>
    </div>

    <script src="js/menu.js"></script>
</body>


</html>
