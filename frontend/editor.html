<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title> MultipleHelper - Editor</title>
    
    
    <link rel="stylesheet" href="lib/codemirror.min.css">    
    <link rel="stylesheet" href="css/shared_style.css">
    <link rel="stylesheet" href="css/editor.css">
</head>
<body>
    <div class="editor-layout">
        <div class="workspace">
            <div class="panel left-panel">
                <div id="editorContainer">
                    <div id="editorInput" style="flex: 1;">  </div>
                </div>
                
            
            </div>
            <div class="panel right-panel">
                <div id="markdownOutput" class="markdown-content"></div>
            </div>


        </div>
            <div class="taskbar">
                <div class="taskbar-group">
                    <button id="backBtn" class="btn taskbar-btn">Menu</button>
                    
                    <div class="roster-container">
                        <button id="rosterBtn" class="btn taskbar-btn"> Users </button>
                        <div id="rosterList" class="roster-dropdown hidden"><!-- All the joining users will be inserted here --></div>
                    </div>

                    <div id="roomNameDisplay" class="room-display"></div>
                </div>
                

                <div class="taskbar-group">
                    <input type="file" id="fileImport" style="display: none;" accept=".json,.txt">
                    <button id="importBtn" class="btn taskbar-btn" style="display: none;">Import Conf File</button>
                    <button id="saveBtn" class="btn taskbar-btn" style="display: none;">Save Conf File</button>
                    <button id="saveMdBtn" class="btn taskbar-btn">Save .md</button>
                    <button id="savePdfBtn" class="btn taskbar-btn">Save .pdf</button>
                </div>
            </div>

    </div>

    
    <script src="lib/codemirror.min.js" defer></script>
    <script src="lib/marked.min.js" defer></script>
    

    <script src="js/app.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/network_editor.js" defer></script>
    <script src="js/UI_editor.js" defer></script>
    <script src="js/main_editor.js" defer></script>
</body>
</html>
